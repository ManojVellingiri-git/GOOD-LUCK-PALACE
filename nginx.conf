# ==============================================================================
# Good Luck Palace (Coimbatore) — Production Nginx Server Block Configuration
# ==============================================================================

server {
    listen 80;
    server_name goodluckpalace.com www.goodluckpalace.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name goodluckpalace.com www.goodluckpalace.com;

    ssl_certificate /etc/letsencrypt/live/goodluckpalace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodluckpalace.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Static Distribution
    root /var/www/goodluck-palace/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
    }
}
